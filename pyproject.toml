[project]
name = "seethrough-rig"
version = "0.1.0"
description = "Turn a single anime illustration into a Live2D-like rigged 2D puppet using See-through layer decomposition"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strig = "seethrough_rig.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seethrough_rig"]
